plugins { id 'com.android.application' }

android {
    namespace 'com.directorsroulette.app'
    compileSdk 35
    signingConfigs {
        release {
            if (System.getenv('RELEASE_KEYSTORE')) {
                storeFile file(System.getenv('RELEASE_KEYSTORE'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    defaultConfig {
        applicationId 'com.directorsroulette.app'
        minSdk 23
        targetSdk 35
        versionCode (System.getenv('ANDROID_VERSION_CODE') ?: '2').toInteger()
        versionName '2.1'
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
